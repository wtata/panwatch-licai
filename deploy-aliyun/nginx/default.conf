# health-ledger nginx — chaolemei.cn (existing) + gushiding.cn (PanWatch)
# Certs for chaolemei at /etc/nginx/certs (mounted from deploy/certs).
# gushiding HTTPS block stays commented until certbot issues certs.

# ---- chaolemei.cn: HTTP -> HTTPS ----
server {
    listen 80 default_server;
    server_name chaolemei.cn www.chaolemei.cn;
    return 301 https://chaolemei.cn$request_uri;
}

# ---- chaolemei.cn: HTTPS (unchanged) ----
server {
    listen 443 ssl;
    http2 on;
    server_name chaolemei.cn;
    client_max_body_size 12m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri /app/index.html;
    }
    location /legal/ {
        alias /usr/share/nginx/html/legal/;
    }
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# ---- gushiding.cn / www: HTTP (PanWatch + ACME) ----
server {
    listen 80;
    server_name gushiding.cn www.gushiding.cn;
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://panwatch:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

